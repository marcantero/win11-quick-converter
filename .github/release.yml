# Groups the automatic release notes by the pull requests' type labels.
changelog:
  categories:
    - title: New features
      labels: ["type: feature"]
    - title: Bug fixes
      labels: ["type: bug"]
    - title: Security
      labels: ["type: security"]
    - title: Documentation
      labels: ["type: docs"]
    - title: Maintenance
      labels: ["type: chore"]
    - title: Other changes
      labels: ["*"]
